## Managed component dependencies.
##
## `lvgl` is pinned to v9.x. `esp_wifi_remote` routes the standard esp_wifi_* API
## to the ESP32-C6 radio over esp-hosted (the P4 has no built-in Wi-Fi). Pin its
## version to match the Waveshare demo's `dependencies.lock` if it differs.
##
## The board BSP supplies the MIPI-DSI panel + touch init and the LVGL port
## (bsp_display_start / bsp_display_lock / unlock). Set the BSP entry below to the
## EXACT component + version the Waveshare demo uses — copy it from the demo's
## `dependencies.lock` (or its `main/idf_component.yml`).
##
## Two cases:
##  1. The demo pulls its BSP from the component registry → uncomment + set the
##     line below to that component (e.g. `waveshare/esp32_p4_*: "==x.y.z"`).
##  2. The demo ships its BSP as a LOCAL `components/<bsp>` folder → copy that
##     folder into `ditto-firmware/components/` instead and leave the line off.
##
## The BSP must expose the esp-bsp convention used in app_main.c:
##   bsp_display_start(), bsp_display_lock(0), bsp_display_unlock()
## (built on espressif/esp_lvgl_port). If the demo instead wires esp_lcd +
## esp_lvgl_port directly, swap those three calls in app_main.c accordingly.
dependencies:
  idf: ">=5.4"
  lvgl/lvgl: "~9.3.0"
  espressif/esp_lvgl_port: "*"
  espressif/esp_wifi_remote: "*"
  espressif/esp_hosted: "*"
  # Waveshare board BSP: MIPI-DSI panel + GT911 touch + esp_lvgl_port + C6/esp-hosted board config.
  # Provides bsp/esp-bsp.h + bsp/display.h (bsp_display_start_with_config, bsp_display_lock, ...).
  waveshare/esp32_p4_wifi6_touch_lcd_4b: "*"
  # <waveshare-bsp-component>: "<version-from-demo-dependencies.lock>"
